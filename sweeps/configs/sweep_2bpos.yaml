# Sweep configuration for multiple bed positions
sweep_name: "2bpos_alpha_beta_sirt3"
base_config: "config_2bpos.yaml"
script: "run_dtnv_2bpos.py"

# SGE resource requirements
sge:
  runtime: "240:00:00"
  memory: "60G"
  cores: 1
  queue: null  # Use default queue
  gpu: true

# Parameter sweep settings
parameters:
  alpha_file: "alphas.csv"
  beta_file: "betas.csv"