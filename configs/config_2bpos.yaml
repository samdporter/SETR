#== Reconstruction settings
num_subsets: [9, 12]
num_epochs: 50
initial_step_size: 0.1
update_interval: null
relaxation_eta: 0.02

#== Regularisation
no_prior: false
use_kappa: true

# Modality-specific TV prior settings
use_modality_specific_priors: true
prior: "tv" # can be tv or rdp
gamma_pet: 10.0
gamma_spect: 10.0
tv_stencil: "6" # can be 6, 18, or 26
delta_tv: null  # defaults to delta if not set
directional_tv: true
tv_both_directions: false

# TNV (vectorial) prior settings
use_tnv_prior: false
gamma_tnv: 10.0
alpha: 1
beta: 1
delta: null
tnv_stencil: "6"
tnv_both_directions: false
tail_singular_values: null
directional_tnv: true
stable: true

#== Image processing
pet_gauss_fwhm: [5.61, 4.83, 4.93] # FROM 710 acceptance testing at UCL (10cm)
spect_gauss_fwhm: [6.7, 6.7, 6.7] # FROM bremss data anyscan
spect_res: [0.81, 0.03, false] # Analytical collimator resolution for SPECT

#== Forward models
no_gpu: false
stop_keep_all_views_in_cache: true
use_tof: false

#== Data paths
pet_data_path: "/home/storage/prepared_data/oxford_patient_data/sirt3/PET"
spect_data_path: "/home/storage/prepared_data/oxford_patient_data/sirt3/SPECT"
output_path: "/home/sam/working/synergistic_recon/output/test"
working_path: "/home/sam/working/synergistic_recon/tmp"

#== Miscellaneous
save_images: true
seed: null
profile: false
