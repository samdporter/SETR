#== Reconstruction settings
num_subsets: [9, 12]
num_epochs: 500
initial_step_size: 0.1
update_interval: 60
relaxation_eta: 0.01
use_scatter: true

#== Regularisation
no_prior: false
use_kappa: true
delta: null # smoothing parameter for TNV / TV

# Modality-specific TV prior settings
use_modality_specific_priors: false
prior: "tv" # can be tv or rdp
gamma_pet: 100.0
gamma_spect: 10.0
tv_stencil: "6" # can be 6, 18, or 26
directional_tv: true
tv_both_directions: false

# TNV (vectorial) prior settings
use_tnv_prior: true
gamma_tnv: 1.0
alpha: 1.0
beta: 1.0
tnv_stencil: "26"
directional_tnv: true
tnv_both_directions: false
tail_singular_values: null
stable: false

#== Image processing
pet_gauss_fwhm: [5.61, 4.83, 4.93] # FROM 710 acceptance testing at UCL (10cm)
spect_gauss_fwhm: [6.7, 6.7, 6.7] # FROM bremss data anyscan
spect_res: [0.81, 0.03, false] # Analytical collimator resolution for SPECT

#== Forward models
no_gpu: false
keep_all_views_in_cache: true
use_tof: false

#== Data paths
pet_data_path: "/home/sporter/synergistic_Y90/prepared_data/oxford_patient_data/sirt3/PET"
spect_data_path: "/home/sporter/synergistic_Y90/prepared_data/oxford_patient_data/sirt3/SPECT"
output_path: "/home/sporter/synergistic_Y90/output/test"
working_path: "/home/sporter/synergistic_recon/tmp"

#== Miscellaneous
save_images: true
seed: null
profile: false
