# DTNV Configuration for MANC NEMA Phantom Bootstrap Reconstructions
# Based on base_config_manc.yaml with 50 epochs for bootstrap analysis

# Data fidelity weights (alpha gets scaled by gradient energy scaling)
# These will be set via command-line arguments or sweep parameters
alpha: 1
beta: 1
delta: null

# Subset configuration
num_subsets: [18, 18]  # [PET, SPECT]

# Reconstruction parameters
num_epochs: 50
initial_step_size: 0.1
relaxation_eta: 0.02
variance_reduction: "svrg"
prior_updates_per_epoch: null

# Kappa weighting
use_kappa: true

# TNV (vectorial) prior settings - DTNV only
use_tnv_prior: true
gamma_tnv: 50.0  # Can be overridden via --override
directional_tnv: true
tail_singular_values: null
stable: false
tnv_both_directions: true
tnv_stencil: "18"
tnv_bnd_cond: "Neumann"
hessian_type: "slow"

# No modality-specific priors for these experiments
use_modality_specific_priors: false
no_prior: false

# Resolution modeling (Mediso Anyscan at 10cm for PET)
pet_gauss_fwhm: [5.1, 4.9, 4.9]
spect_gauss_fwhm: [6.7, 6.7, 6.7]
spect_res: [0.81, 0.03, false]  # Analytical collimator resolution

# Data paths - will be overridden for each bootstrap
pet_data_path: "/home/storage/prepared_data/phantom_data/manc_nema_phantom_data/PET/bootstraps/nonparametric/prompts_nonparam_s73_sf0.05_000"
spect_data_path: "/home/storage/prepared_data/phantom_data/manc_nema_phantom_data/SPECT"
output_path: "/home/sam/working/synergistic_recon/results/manc_bootstraps/dtnv/bootstrap_000"
working_path: "/home/sam/working/synergistic_recon/tmp"

# Runtime settings
save_images: true
save_gradients: false
save_preconditioners: false
seed: 42  # Fixed seed for reproducibility
no_gpu: false
keep_all_views_in_cache: true
profile: false
flip: true  # IMPORTANT: Flip SPECT for MANC data
use_scatter: true

# Metrics computation (optional - set reference_path if comparing to ground truth)
compute_metrics: false
metrics_interval: null
reference_path: null
mask_threshold: 0.01
metrics_normalization: "range"
