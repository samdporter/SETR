# HKEM (Hybrid Kernelized EM) Configuration - Multiple Bed Positions
# This configuration is for multi-bed PET reconstruction with kernel operators

# Basic reconstruction parameters
modality: "PET"
method: "ista"   # Only ISTA supported for multi-bed reconstruction

# Data paths
pet_data_path: "/home/storage/prepared_data/oxford_patient_data/sirt3/PET"
output_path: "/home/sam/working/synergistic_recon/results/hkem_pet_2bpos"
working_path: "/home/sam/working/synergistic_recon/tmp"

# Algorithm parameters
num_subsets: 9
num_epochs: 30
initial_step_size: 1.0
relaxation_eta: 0.02

# Kernel operator parameters
num_neighbours: 5
num_non_zero_features: 1
sigma_anatomical: 0.1              # Anatomical similarity parameter
sigma_emission: 0.1                # Emission similarity parameter
sigma_distance_anatomical: 0.1     # Distance weighting parameter for anatomical features
sigma_distance_emission: 0.1       # Distance weighting parameter for emission features
normalize_features: false          # Normalize features before kernel computation
normalize_kernel: false            # Normalize kernel before application
use_mask: false                    # Use k-nearest neighbor masking
mask_k: null                       # Number of neighbors for masking (null = use all)
recalc_mask: false                 # Recalculate mask at each iteration
distance_weighting: false          # Apply distance-based weighting to kernel
hybrid: true                       # Enable hybrid anatomical+emission kernel
kernel_backend: "auto"             # Options: "auto", "numba", "python"
only_2D: false  # Use 2D kernels only (true = only_2D in old code)
guidance: "emission"

# Preconditioner parameters
freeze_iter: 72  # Iteration to freeze kernel parameters (inf = never freeze)

# Image processing parameters
pet_gauss_fwhm: [5.61, 4.83, 4.93] # FROM 710 acceptance testing at UCL (10cm)

# System parameters
no_gpu: false
use_tof: false
seed: null

# Multi-bed specific parameters
# Bed position suffixes are hardcoded as ["_f1b1", "_f2b1"]
# These correspond to the expected file naming convention

# Advanced parameters
tail_singular_values: null
delta: null
diagonal: false
both_directions: false