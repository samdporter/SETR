#== DTV Single bed position - PET only reconstruction
#== Uses directional TV prior guided by PET umap or emission guidance

#== Guidance Configuration  
use_emission_guidance: false  # If true, requires emission_guidance_path
# emission_guidance_path: "/path/to/emission_guidance.hv"  # Optional PET guidance from CT-guided SPECT

#== Reconstruction settings
num_subsets: 9  # PET subsets
num_epochs: 10
initial_step_size: 0.1
update_interval: 1
relaxation_eta: 0.02
use_scatter: true

#== Regularisation
no_prior: false
use_kappa: true
delta: null # smoothing parameter for DTV (auto-computed if null)

# DTV prior weight
gamma_pet: 50.0      # Weight for PET directional TV prior

# PET DTV settings
pet_stencil: "6"           # Stencil connectivity: 6, 18, or 26
pet_both_directions: false # Use bidirectional gradients

#== Image processing
pet_gauss_fwhm: [7.3, 7.3, 7.3]   # PET resolution modeling

#== Forward models
no_gpu: false
keep_all_views_in_cache: true
use_tof: false

#== Data paths
pet_data_path: "/home/storage/prepared_data/phantom_data/anthropomorphic_phantom_data/PET/phantom"
output_path: "/home/sam/working/synergistic_recon/output/dtv_1bpos_pet"
working_path: "/home/sam/working/synergistic_recon/tmp"

#== Miscellaneous
save_images: true
seed: null
profile: false