# HKEM (Hybrid Kernelized EM) Configuration - Single Bed Position
# This configuration supports both KOSMAPOSL and ISTA-based HKEM reconstruction

# Basic reconstruction parameters
modality: "SPECT"  # Options: "PET", "SPECT"
method: "ista"   # Options: "kosmaposl", "ista"
guidance: "attenuation"  # Options: "attenuation", "emission"
use_scatter: true

# Data paths
data_path: "/home/storage/prepared_data/oxford_patient_data/sirt2/SPECT"
spect_data_path: "/home/storage/prepared_data/oxford_patient_data/sirt2/SPECT"
output_path: "/home/sam/working/synergistic_recon/results/sirt2/hkem_spect_2bpos"
working_path: "/home/sam/working/synergistic_recon/tmp"

# Algorithm parameters
num_subsets: 12
num_epochs: 15
step_size: 1
sampling: "sequential"  # Options: "sequential", "staggered"

# Kernel operator parameters
num_neighbours: 5
num_non_zero_features: 1
sigma_anatomical: 1.0              # Anatomical similarity parameter (sigma_m in old code)
sigma_emission: 0.1                # Emission similarity parameter (sigma_p in old code)
sigma_distance_anatomical: 5.0     # Distance weighting parameter for anatomical features
sigma_distance_emission: 5.0       # Distance weighting parameter for emission features
hybrid: true                       # Enable hybrid anatomical+emission kernel
only_2D: false  # Use 2D kernels only (true = only_2D in old code)

# Preconditioner parameters
freeze_iter: 60  # Iteration to freeze kernel parameters (inf = never freeze)

# Image processing parameters
gauss_fwhm: [6.78, 6.78, 6.78]
spect_res: [1.31, 0.027, false] # Analytical collimator resolution for SPECT

# System parameters
no_gpu: false        # Disable GPU acceleration
seed: null           # Random seed for reproducibility

# Advanced parameters (usually don't need to change)
use_tof: false