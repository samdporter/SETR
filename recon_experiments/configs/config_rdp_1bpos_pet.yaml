# RDP (Relative Difference Prior) Configuration - Single Bed Position PET
# This configuration supports RDP-based reconstruction for PET data

# Basic reconstruction parameters
modality: "PET"  # Modality: PET

# Data paths
data_path: "/home/storage/prepared_data/phantom_data/anthropomorphic_phantom_data/PET/phantom"
output_path: "/home/sam/working/synergistic_recon/results/rdp_pet_1bpos"
working_path: "/home/sam/working/synergistic_recon/tmp"

# Algorithm parameters
num_subsets: 9
num_epochs: 30
initial_step_size: 0.1
relaxation_eta: 0.02
sampling: "sequential"  # Options: "sequential", "staggered"

# RDP prior parameters
beta: 50.0               # RDP penalty factor (regularization strength)
gamma: 1.0              # RDP shape parameter (edge preservation vs smoothing)
stencil: "6"           # Stencil connectivity: "6" (faces), "18" (faces+edges), "26" (faces+edges+corners)
both_directions: false  # Include both forward and backward differences
directional: true  # Use directional differences (true = use directional differences)

# Image processing parameters
gauss_fwhm: [5.1, 4.9, 4.9]

# System parameters
no_gpu: false           # Disable GPU acceleration
save_images: true       # Save intermediate images during reconstruction

# Advanced parameters
use_tof: false