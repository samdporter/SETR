# HKEM Configuration for MANC NEMA Phantom - SPECT Reconstruction
# Based on config_hkem_2bpos_spect.yaml

# Basic reconstruction parameters
modality: "SPECT"
method: "ista"
guidance: "attenuation"
use_scatter: true

# Data paths (will be updated by pipeline script)
data_path: "/home/storage/prepared_data/phantom_data/manc_nema_phantom_data/SPECT"
spect_data_path: "/home/storage/prepared_data/phantom_data/manc_nema_phantom_data/SPECT"
output_path: "/home/sam/working/synergistic_recon/results/manc_bootstraps/hkem/spect_hkem"
working_path: "/home/sam/working/synergistic_recon/tmp"

# Algorithm parameters (from patient configs)
num_subsets: 12
num_epochs: 15
step_size: 1
sampling: "sequential"

# Kernel operator parameters (from patient SPECT config)
num_neighbours: 5
num_non_zero_features: 1
sigma_anatomical: 1.0
sigma_emission: 0.1
sigma_distance_anatomical: 5.0
sigma_distance_emission: 5.0
hybrid: true
only_2D: false

# Preconditioner parameters
freeze_iter: 60  # Iteration to freeze kernel parameters

# Image processing parameters
gauss_fwhm: [6.78, 6.78, 6.78]
spect_res: [1.31, 0.027, false]  # Analytical collimator resolution for SPECT

# System parameters
no_gpu: false
seed: null
use_tof: false
flip: true  # IMPORTANT: Flip SPECT for MANC data
