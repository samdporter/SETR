#== Reconstruction settings
num_subsets: [18, 18]
num_epochs: 25
initial_step_size: 1
initial_iteration_offset: 0
update_interval: 36
relaxation_eta: 0.002
use_scatter: true
variance_reduction: "svrg" # can be "svrg", "saga", or "none"

#== Regularisation
no_prior: false
use_kappa: false
delta: null # smoothing parameter for TNV / TV
dynamic_percentile: 95.0  # Percentile for computing dynamic ranges
delta_divisor: 20.0
epsilon_divisor: 100.0  # Epsilon = dynamic_range / divisor (for log TNV)
prior_updates_per_epoch: null
snapshot_interval_factor: 1.0  # Update SVRG snapshot every epoch (was 2x)
precond_type: "mm_diag_block_maj"
em_precond_smooth: true
em_precond_smoothing_fwhm: [5, 5, 5]
em_precond_cap_to_initial_max: false
em_precond_cap_to_initial_max_factor: 2.0
precond_cap_to_initial_max: false
precond_cap_to_initial_max_factor: 2.0

# TNV (vectorial) prior settings
use_tnv_prior: true
gamma_tnv: 0.01
alpha: 1
beta: 1
use_log_tnv: false
tnv_stencil: "6" # can be 6, 18, or 26
tnv_max_step: 1
tnv_bnd_cond: "Neumann"
directional_tnv: true
tnv_both_directions: false
tail_singular_values: null
stable: true
smoothing: 'charbonnier' # can be charbonnier, fair or perona_malik

# Modality-specific TV prior settings
use_modality_specific_priors: false
prior: "tv" # can be tv or rdp
gamma_pet: 0.5
gamma_spect: 0.5
tv_stencil: "6" # can be 6, 18, or 26
tv_max_step: 1
tv_bnd_cond: "Neumann"
directional_tv: true
tv_both_directions: false

#== Image processing
pet_gauss_fwhm: [5.61, 4.83, 4.93] # FROM 710 acceptance testing at UCL (10cm)
spect_gauss_fwhm: [6.8, 6.8, 6.8] # FROM bremss data anyscan
spect_res: [1.31, 0.027, false] # Analytical collimator resolution for SPECT
use_zoom_registration: false

#== Forward models
no_gpu: false
keep_all_views_in_cache: true
use_tof: false

#== Support masks
support_mask_from_sensitivity: true
support_mask_rel_threshold: 0.001
support_mask_abs_threshold: 0.0
support_mask_from_spect_attenuation: false
support_mask_spect_attn_rel_threshold: 0.0
support_mask_spect_attn_abs_threshold: 0.01
save_support_mask: true

pet_data_path: "/home/sporter/synergistic_Y90/prepared_data/phantom_data/anthropomorphic_phantom_data/PET/phantom_short"
spect_data_path: "/home/sporter/synergistic_Y90/prepared_data/phantom_data/anthropomorphic_phantom_data/SPECT/phantom_140"
pet_initial_image_path: null
spect_initial_image_path: null
output_path: "/home/sporter/synergistic_Y90/SETR2/output/test_anthro"
working_path: "/home/sporter/synergistic_Y90/SETR2/tmp"

#== Miscellaneous
save_images: false
save_gradients: false
save_preconditioners: false
seed: 42
profile: false
flip: false
