# HKEM Configuration for MANC NEMA Phantom - PET Bootstrap Reconstructions
# Based on config_hkem_2bpos.yaml (patient PET config)

# Basic reconstruction parameters
modality: "PET"
method: "ista"
use_scatter: true

# Data paths (will be updated by pipeline script for each bootstrap)
pet_data_path: "/home/storage/prepared_data/phantom_data/manc_nema_phantom_data/PET/bootstraps/nonparametric/prompts_nonparam_s73_sf0.05_000"
output_path: "/home/sam/working/synergistic_recon/results/manc_bootstraps/hkem/bootstrap_000"
working_path: "/home/sam/working/synergistic_recon/tmp"

# Algorithm parameters (from patient PET config)
num_subsets: 9
num_epochs: 15
step_size: 1

# Kernel operator parameters (from patient PET config)
num_neighbours: 5
num_non_zero_features: 1
sigma_anatomical: 0.5
sigma_emission: 1
sigma_distance_anatomical: 5
sigma_distance_emission: 5
hybrid: true
only_2D: false
guidance: "emission"  # Use SPECT as emission guidance

# Preconditioner parameters
freeze_iter: 27  # Iteration to freeze kernel parameters

# Image processing parameters (Mediso Anyscan at 10cm)
pet_gauss_fwhm: [5.61, 4.83, 4.93]

# System parameters
no_gpu: false
use_tof: false
seed: null
