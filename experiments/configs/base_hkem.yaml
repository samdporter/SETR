# Base configuration for HKEM algorithm
# HKEM uses ordered subsets (SGFunction), not variance reduction

#== Reconstruction settings
num_epochs: 10  # HKEM: 10 epochs for both PET and SPECT
step_size: 1
sampling: "sequential"  # Ordered subsets

#== Note: num_subsets is phantom-specific
# PET HKEM: 9 subsets
# SPECT HKEM: 12 subsets

#== Preconditioner parameters
freeze_iter: 90  # Freeze at 90% of iterations

#== Forward models
no_gpu: false
use_scatter: true

#== Miscellaneous
seed: null
working_path: "/home/sam/working/synergistic_recon/tmp"

#== Kernel hyperparameters (shared defaults)
num_neighbours: 5
num_non_zero_features: 1
hybrid: true
only_2D: false
