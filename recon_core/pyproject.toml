[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-core"
version = "0.2.0"
description = "Core reconstruction library for multimodal PET/SPECT/CT imaging"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sam Porter", email = "sam.porter.18@ucl.ac.uk"}
]
maintainers = [
    {name = "Sam Porter", email = "sam.porter.18@ucl.ac.uk"}
]
keywords = [
    "PET",
    "SPECT",
    "nuclear-medicine",
    "tomographic-reconstruction",
    "multimodal-imaging",
    "image-reconstruction",
    "regularisation",
    "total-variation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"

# Minimal core dependencies only
dependencies = [
    "torch>=2.0.0",
    "numba>=0.58.0",
    "numpy>=1.21.0,<2.0.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",  # For CSV I/O in callbacks and config
    "pyyaml>=5.4.0",  # For config file parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.8",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "pre-commit>=3.7.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/samdporter/setr"
Documentation = "https://setr.readthedocs.io"
Repository = "https://github.com/samdporter/setr"
"Bug Tracker" = "https://github.com/samdporter/setr/issues"
Changelog = "https://github.com/samdporter/setr/blob/main/recon_core/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@\\(abc\\.\\)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.format]
# Keep defaults (Black-compatible)

[tool.ruff.lint]
# E,F: pycodestyle/pyflakes; I: import sorting
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# Honour sections; keep default profile
known-first-party = ["recon_core"]
combine-as-imports = true

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = false  # Gradually enable
warn_return_any = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true
mypy_path = ["src"]

[tool.bandit]
skips = []
tests = []
targets = ["src"]
